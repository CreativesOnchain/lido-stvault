[package]
name = "stvault-receipt"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Creatives Onchain", "Lido stVault Contributors"]
description = "CLI tool and library that verifies the post-submission status of Lido stVault validator consolidation requests across Ethereum execution and consensus layers using exact block-level state delta proofs."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/CreativesOnchain/lido-stvault"
homepage = "https://github.com/CreativesOnchain/lido-stvault"
keywords = ["ethereum", "lido", "stvault", "eip-7251", "validators"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[lib]
name = "stvault_receipt"
path = "src/lib.rs"

[[bin]]
name = "stvault-receipt"
path = "src/main.rs"

[dependencies]
# CLI & Terminal UX
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
comfy-table = "7.2"
colored = "3.1"
indicatif = "0.17"

# Async & Networking
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
url = "2.5"

# Ethereum & Alloy
alloy-primitives = { version = "0.8", features = ["serde"] }

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.4"
hex = "0.4"

# Error Handling & Logging
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27"
